<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome to Our User Dashboard</title>
  <link rel="shortcut icon" href="../images/ChatGPT Image Nov 15, 2025, 09_59_30 PM.png" type="image/x-icon" />
  <link rel="stylesheet" href="../otherpages.css/dashboard.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <style>
    /* PROFILE OVERLAY */
    .overlay {
      display: none;
      position: fixed;
      top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .confirm-box {
      background: #fff;
      padding: 20px 30px;
      border-radius: 10px;
      text-align: center;
      max-width: 350px;
      width: 90%;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .confirm-buttons {
      margin-top: 20px;
      display: flex;
      justify-content: space-around;
    }
    .confirm-btn, .cancel-btn {
      padding: 8px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: 600;
    }
    .confirm-btn {
      background: #2ecc71;
      color: #fff;
    }
    .cancel-btn {
      background: #e74c3c;
      color: #fff;
    }
    /* Make profile picture cursor pointer */
    #profilePicture {
      cursor: pointer;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
    }
    /* Layout for forms and chart */
    .quick-actions, .transactions-section, .chart-section {
      padding: 20px 30px;
      background: #fff;
      margin: 16px 30px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(16,24,40,0.06);
    }

    .income-form, .expense-form {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .income-form input, .expense-form input, .expense-form select {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #e6e9ef;
      font-size: 0.95rem;
    }

    .action-btn {
      background: #6c5ce7;
      color: #fff;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .chart-container { max-width: 720px; margin: 0 auto; }
    .chart-section h2 { margin-bottom: 12px; }

    .transactions-list { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
    .transaction-item { display:flex; align-items:center; gap:12px; padding:10px; border-radius:10px; border:1px solid #f0f2f5; }
    .transaction-icon { width:40px; height:40px; display:flex; align-items:center; justify-content:center; background:#f6f7fb; border-radius:8px; }
    .transaction-details h4 { margin:0; font-size:1rem; }
    .transaction-details p { margin:0; font-size:0.85rem; color:#7b8087; }
    .transaction-amount { margin-left:auto; font-weight:700; }
    .transaction-item.negative { border-left: 4px solid #e17055; }
    .transaction-item.positive { border-left: 4px solid #00b894; }
    .delete-btn { background: transparent; border: none; color:#b71c1c; cursor:pointer; margin-left:8px; }
  </style>
</head>
<body>
  <nav>
    <div class="nav-container">
      <div class="logo">
        <h2>NovaWallet</h2>
        <img src="../images/edited_NovaWallet-removebg-preview.png" alt="">
      </div>
      <div class="user-mini">
        <label class="profile-container">
          <img id="profilePicture" src="../images/avatar.jpg" alt="Profile">
        </label>
        <input type="file" id="profileInput" accept="image/*" style="display: none;">
        <span id="welcomeMessage"></span>
      </div>
      <button class="logout-btn" id="logoutBtn">
        <i class="fas fa-sign-out-alt"></i> Logout
      </button>
    </div>
  </nav>

  <!-- PROFILE CONFIRM OVERLAY -->
  <div id="profileConfirmOverlay" class="overlay">
    <div class="confirm-box">
      <h3>Change Profile Picture?</h3>
      <p>Are you sure you want to update your profile picture?</p>
      <div class="confirm-buttons">
        <button id="cancelChange" class="cancel-btn">Cancel</button>
        <button id="confirmChange" class="confirm-btn">Yes, Continue</button>
      </div>
    </div>
  </div>

  <!-- DASHBOARD CONTENT -->
  <div class="dashboard">
    <div class="dashboard-header">
      <h1>Expense Tracker Dashboard</h1>
      <p>Manage your income and expenses</p>
    </div>

    <!-- BALANCE DISPLAY -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-wallet"></i></div>
        <div class="stat-content">
          <h3 id="balanceTitle">Current Balance</h3>
          <div class="stat-value" id="balance">$0.00</div>
        </div>
      </div>
    </div>

    

    <!-- INCOME SECTION -->
    <div class="quick-actions">
      <h2>Add Income</h2>
      <div class="income-form">
        <input type="text" id="incomeSource" placeholder="From (Person / Source)" />
        <input type="number" id="incomeAmount" placeholder="Enter income amount" min="0" step="0.01"/>
        <button id="addIncomeBtn" class="action-btn"><i class="fas fa-plus"></i> Add Income</button>
      </div>
    </div>

    <!-- EXPENSE SECTION -->
    <div class="transactions-section">
      <div class="section-header"><h2>Add Expense</h2></div>
      <div class="expense-form">
        <input type="text" id="expenseDescription" placeholder="Expense description"/>
        <select id="expenseCategory">
          <option value="Other">Other</option>
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Bills">Bills</option>
          <option value="Shopping">Shopping</option>
          <option value="Entertainment">Entertainment</option>
        </select>
        <input type="number" id="expenseAmount" placeholder="Amount" min="0" step="0.01"/>
        <button id="addExpenseBtn" class="action-btn"><i class="fas fa-plus"></i> Add Expense</button>
      </div>
    </div>

    <!-- EXPENSE LIST -->
    <div class="transactions-section">
      <div class="section-header"><h2>Expense List</h2></div>
      <div class="transactions-list" id="expenseList"></div>
    </div>
  </div>
  <!-- CHART: Expense breakdown -->
    <div class="chart-section">
      <h2>Spending Breakdown</h2>
      <div class="chart-container">
        <canvas id="expenseChart" width="400" height="220"></canvas>
      </div>
    </div>
  

  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBb5SR7xj5ywVECkaRWEW4Bh0kHMj01WvQ",
      authDomain: "novawallet-6e0cb.firebaseapp.com",
      projectId: "novawallet-6e0cb",
      storageBucket: "novawallet-6e0cb.firebasestorage.app",
      messagingSenderId: "408070207218",
      appId: "1:408070207218:web:aee6c3a06582964ab4026b",
      measurementId: "G-1HPGP8X45H"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    let currentUser = null;
    let storedUsername = null;
    let transactions = []; // both incomes and expenses

    const welcomeMessage = document.getElementById("welcomeMessage");
    const logoutBtn = document.getElementById("logoutBtn");
    const balanceElement = document.getElementById("balance");
    const addIncomeBtn = document.getElementById("addIncomeBtn");
    const incomeAmount = document.getElementById("incomeAmount");
    const incomeSource = document.getElementById("incomeSource");
    const addExpenseBtn = document.getElementById("addExpenseBtn");
    const expenseDescription = document.getElementById("expenseDescription");
    const expenseCategory = document.getElementById("expenseCategory");
    const expenseAmount = document.getElementById("expenseAmount");
    const expenseList = document.getElementById("expenseList");
    const expenseChartCanvas = document.getElementById("expenseChart");

    // PROFILE ELEMENTS
    const profileInput = document.getElementById("profileInput");
    const profilePicture = document.getElementById("profilePicture");
    const overlay = document.getElementById("profileConfirmOverlay");
    const cancelBtn = document.getElementById("cancelChange");
    const confirmBtn = document.getElementById("confirmChange");

    // Load saved profile image
    const savedImage = localStorage.getItem("nova_profile_image");
    if (savedImage) profilePicture.src = savedImage;

    // Profile confirmation logic
    profilePicture.addEventListener("click", () => overlay.style.display = "flex");
    cancelBtn.addEventListener("click", () => overlay.style.display = "none");
    confirmBtn.addEventListener("click", () => {
      overlay.style.display = "none";
      profileInput.click();
    });
    profileInput.addEventListener("change", function () {
      const file = this.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        profilePicture.src = e.target.result;
        localStorage.setItem("nova_profile_image", e.target.result);
      };
      reader.readAsDataURL(file);
    });

    // Chart state
    let expenseChart = null;

    onAuthStateChanged(auth, (user) => {
      if (!user) return window.location.href = "login.html";
      currentUser = user;
      storedUsername = localStorage.getItem("novaWalletUsername") || "User";
      welcomeMessage.textContent = `Welcome back, ${storedUsername}!`;
      loadUserData();
    });

    function loadUserData() {
      transactions = JSON.parse(localStorage.getItem(`${storedUsername}_transactions`)) || [];
      updateBalance();
      updateTransactionList();
      updateChart();
    }

    function saveTransactions() {
      localStorage.setItem(`${storedUsername}_transactions`, JSON.stringify(transactions));
    }

    function updateBalance() {
      const total = transactions.reduce((acc, t) => {
        return t.type === 'income' ? acc + t.amount : acc - t.amount;
      }, 0);
      balanceElement.textContent = `$${total.toFixed(2)}`;
      localStorage.setItem(`${storedUsername}_balance`, total.toString());
    }

    function updateTransactionList() {
      expenseList.innerHTML = "";
      transactions.slice().reverse().forEach((tx, revIndex) => {
        // show most recent first; compute actual index
        const index = transactions.length - 1 - revIndex;
        const item = document.createElement('div');
        item.className = `transaction-item ${tx.type === 'income' ? 'positive' : 'negative'}`;
        item.innerHTML = `
          <div class="transaction-icon"><i class="fas ${tx.type === 'income' ? 'fa-hand-holding-usd' : 'fa-shopping-cart'}"></i></div>
          <div class="transaction-details">
            <h4>${tx.description || (tx.type === 'income' ? 'Income' : 'Expense')}</h4>
            <p>${new Date(tx.date).toLocaleString()} • ${tx.type === 'expense' ? tx.category : 'Source: ' + (tx.source || '—')}</p>
          </div>
          <div class="transaction-amount">${tx.type === 'income' ? '+' : '-'}$${tx.amount.toFixed(2)}</div>
          <button class="delete-btn" data-index="${index}"><i class="fas fa-trash"></i></button>
        `;
        expenseList.appendChild(item);
      });
      saveTransactions();
    }

    function updateChart() {
      // Aggregate expense categories
      const expenseTx = transactions.filter(t => t.type === 'expense');
      const byCat = {};
      expenseTx.forEach(e => {
        byCat[e.category] = (byCat[e.category] || 0) + e.amount;
      });
      const labels = Object.keys(byCat);
      const data = labels.map(l => byCat[l]);

      if (!expenseChart) {
        expenseChart = new Chart(expenseChartCanvas.getContext('2d'), {
          type: 'pie',
          data: {
            labels,
            datasets: [{
              data,
              backgroundColor: [
                '#6c5ce7', '#fd79a8', '#00b894', '#0984e3', '#e17055', '#00cec9'
              ],
            }]
          },
          options: {
            plugins: {
              legend: { position: 'bottom' }
            }
          }
        });
      } else {
        expenseChart.data.labels = labels;
        expenseChart.data.datasets[0].data = data;
        expenseChart.update();
      }
    }

    addIncomeBtn.addEventListener('click', () => {
      const amount = parseFloat(incomeAmount.value);
      const source = incomeSource.value.trim();
      if (amount > 0) {
        const tx = { type: 'income', description: source || 'Income', source: source || 'Unknown', amount, date: new Date().toISOString() };
        transactions.push(tx);
        updateBalance();
        updateTransactionList();
        updateChart();
        incomeAmount.value = '';
        incomeSource.value = '';
        alert('Income added successfully!');
      } else alert('Please enter a valid income amount.');
    });

    addExpenseBtn.addEventListener('click', () => {
      const description = expenseDescription.value.trim();
      const category = expenseCategory.value || 'Other';
      const amount = parseFloat(expenseAmount.value);
      if (description && amount > 0) {
        const tx = { type: 'expense', description, category, amount, date: new Date().toISOString() };
        transactions.push(tx);
        updateBalance();
        updateTransactionList();
        updateChart();
        expenseDescription.value = '';
        expenseAmount.value = '';
        expenseCategory.value = 'Other';
        alert('Expense added successfully!');
      } else alert('Please enter a valid description and amount.');
    });

    expenseList.addEventListener('click', (e) => {
      const btn = e.target.closest('.delete-btn');
      if (!btn) return;
      const index = parseInt(btn.dataset.index, 10);
      const tx = transactions[index];
      if (confirm(`Delete "${tx.description}" ${tx.type === 'income' ? 'income' : 'expense'} for $${tx.amount.toFixed(2)}?`)) {
        transactions.splice(index, 1);
        updateBalance();
        updateTransactionList();
        updateChart();
      }
    });

    logoutBtn.addEventListener('click', () => {
      if (confirm(`${storedUsername}, are you sure you want to log out?`)) {
        localStorage.removeItem("novaWalletUsername");
        localStorage.removeItem("LoggedInUser");
        window.location.href = "login.html";
      }
    });

  </script>
</body>
</html>
