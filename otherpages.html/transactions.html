<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transactions - NovaWallet</title>
  <link rel="shortcut icon" href="../images/ChatGPT Image Nov 15, 2025, 09_59_30 PM.png" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f5f7fa;
      margin: 0;
      padding: 0;
      color: #333;
    }

    header {
      background-color: #6c5ce7;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 2rem;
    }

    .totals {
      display: flex;
      gap: 20px;
      padding: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .totals .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      min-width: 180px;
      text-align: center;
      box-shadow: 0 5px 15px rgba(0,0,0,0.05);
    }

    .totals .card h3 {
      margin-bottom: 10px;
      color: #636e72;
    }

    .totals .card p {
      font-size: 1.4rem;
      font-weight: 600;
      color: #2d3436;
    }

    .transactions-section {
      padding: 20px;
      max-width: 900px;
      margin: 0 auto 40px auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.05);
    }

    .transactions-section h2 {
      margin-bottom: 15px;
      color: #2d3436;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    table thead {
      background-color: #6c5ce7;
      color: white;
    }

    table thead th {
      padding: 12px;
      text-align: left;
    }

    table tbody td {
      padding: 12px;
      border-bottom: 1px solid #e0e0e0;
    }

    table tbody tr:hover {
      background-color: #f1f1f1;
    }

    .minus {
      color: #d63031;
      font-weight: 600;
    }

    .delete-btn {
      cursor: pointer;
      background: transparent;
      border: none;
      color: #d63031;
      font-size: 1rem;
    }

    @media (max-width: 600px) {
      .totals {
        flex-direction: column;
        align-items: center;
      }

      table thead {
        display: none;
      }

      table, table tbody, table tr, table td {
        display: block;
        width: 100%;
      }

      table tr {
        margin-bottom: 15px;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        padding: 10px;
      }

      table td {
        text-align: right;
        padding-left: 50%;
        position: relative;
      }

      table td::before {
        content: attr(data-label);
        position: absolute;
        left: 15px;
        font-weight: 600;
        text-transform: uppercase;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Transactions</h1>
  </header>

  <div class="totals">
    <div class="card">
      <h3>Current Balance</h3>
      <p id="balance">₦0.00</p>
    </div>
    <div class="card">
      <h3>Total Income</h3>
      <p id="totalIncome">₦0.00</p>
    </div>
    <div class="card">
      <h3>Total Expenses</h3>
      <p id="totalExpenses">₦0.00</p>
    </div>
  </div>

  <div class="transactions-section">
    <h2>All Expenses</h2>
    <table id="transactionsTable">
      <thead>
        <tr>
          <th>Date</th>
          <th>Description</th>
          <th>Category</th>
          <th>Amount</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="transactionsBody">
        <!-- Transactions inserted by JS -->
      </tbody>
    </table>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const balanceElement = document.getElementById('balance');
      const totalIncomeElement = document.getElementById('totalIncome');
      const totalExpensesElement = document.getElementById('totalExpenses');
      const transactionsBody = document.getElementById('transactionsBody');

      const storedUsername = localStorage.getItem('novaWalletUsername');

      if (!storedUsername) return;

      let balance = parseFloat(localStorage.getItem(`${storedUsername}_balance`)) || 0;
      let totalIncome = parseFloat(localStorage.getItem(`${storedUsername}_totalIncome`)) || 0;
      let expenses = JSON.parse(localStorage.getItem(`${storedUsername}_expenses`)) || [];

      function renderTransactions() {
        transactionsBody.innerHTML = '';
        const totalExpenses = expenses.reduce((sum, e) => sum + e.amount, 0);

        balanceElement.textContent = `₦${balance.toFixed(2)}`;
        totalIncomeElement.textContent = `₦${totalIncome.toFixed(2)}`;
        totalExpensesElement.textContent = `₦${totalExpenses.toFixed(2)}`;

        expenses.forEach((expense, index) => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td data-label="Date">${new Date(expense.date).toLocaleDateString()}</td>
            <td data-label="Description">${expense.description}</td>
            <td data-label="Category">Expense</td>
            <td data-label="Amount" class="minus">-₦${expense.amount.toFixed(2)}</td>
            <td data-label="Action">
              <button class="delete-btn" data-index="${index}">Delete</button>
            </td>
          `;
          transactionsBody.appendChild(row);
        });
      }

      renderTransactions();

      // Delete functionality
      transactionsBody.addEventListener('click', function(e) {
        const btn = e.target.closest('.delete-btn');
        if (!btn) return;

        const index = btn.dataset.index;
        const expense = expenses[index];

        if (confirm(`Are you sure you want to delete "${expense.description}" for ₦${expense.amount.toFixed(2)}?`)) {
          balance += expense.amount;
          expenses.splice(index, 1);
          localStorage.setItem(`${storedUsername}_balance`, balance.toString());
          localStorage.setItem(`${storedUsername}_expenses`, JSON.stringify(expenses));
          renderTransactions();
        }
      });
    });
  </script>
</body>
</html>
