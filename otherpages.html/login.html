<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta-name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - NovaWallet</title>
  <!-- <link rel="shortcut icon" href="../images/ChatGPT Image Nov 15, 2025, 09_59_30 PM.png" type="image/x-icon"> -->
  <link rel="stylesheet" href="../otherpages.css/login.css">
  <link rel="shortcut icon" href="../images/ChatGPT Image Nov 15, 2025, 09_59_30 PM.png" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<style>
  
</style>

<body>

  <div class="container">
    <h1 id="loginTitle">Login</h1>

     <!-- 🔥 ERROR BOX ADDED HERE -->
    <div id="error-box" class="hidden">
      <p id="error-text"></p>
      <span id="close-error">Close</span>
    </div>

    <form id="loginForm">
      <div class="input-group">
        <input type="email" id="email" placeholder="email@gmail.com" required>
        <input type="password" id="password" placeholder="Password" required>
      </div>

      <button type="submit" id="submit">Log In</button>

      <p class="signup-link">
        Don't have an account? <a href="./sign-up.html">Sign up</a>
      </p>

      <p class="forgot-link">
        <a href="./forgot.html">Forgot Password?</a>
      </p>

      <p id="error-msg"></p>
    </form>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

  const firebaseConfig = {
      apiKey: "AIzaSyBb5SR7xj5ywVECkaRWEW4Bh0kHMj01WvQ",
      authDomain: "novawallet-6e0cb.firebaseapp.com",
      projectId: "novawallet-6e0cb",
      storageBucket: "novawallet-6e0cb.firebasestorage.app",
      messagingSenderId: "408070207218",
      appId: "1:408070207218:web:aee6c3a06582964ab4026b",
      measurementId: "G-1HPGP8X45H"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const errorBox = document.getElementById("error-box");
  const errorText = document.getElementById("error-text");
  const closeError = document.getElementById("close-error");

  function showError(message) {
    errorText.textContent = message;
    errorBox.classList.remove("hidden");
  }

  closeError.addEventListener("click", () => {
    errorBox.classList.add("hidden");
  });

  const loginForm = document.getElementById("loginForm");

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();

    if (!email || !password) {
      showError("All fields are required.");
      return;
    }

    if (!email.includes('@')) {
      showError("Please enter a valid email address.");
      return;
    }

    if (password.length < 6) {
      showError("Password should be at least 6 characters long.");
      return;
    }

    const submitBtn = document.getElementById('submit');
    submitBtn.style.cursor = "not-allowed"
    submitBtn.style.backgroundColor = "gray"
    submitBtn.textContent = "Logging In...";
    try {
  const credential = await signInWithEmailAndPassword(auth, email, password);

  // ✅ Check if email is verified
  if (!credential.user.emailVerified) {
    showError("Please verify your email before logging in. Check your inbox!");
    return;
  }

  // ✅ Save displayName from Firebase
  localStorage.setItem("novaWalletUsername", credential.user.displayName || "User");

  showError("✅Login successful!");
  loginForm.reset();
  window.location.href = "./dashboard.html";

} catch (error) {
  console.log(error);
  showError(error.message);
}

  });
</script>




</body>
</html>
