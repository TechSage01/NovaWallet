<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signup - NovaWallet</title>
  <link rel="shortcut icon" href="../images/ChatGPT Image Nov 15, 2025, 09_59_30 PM.png" type="image/x-icon">
  <link rel="stylesheet" href="../otherpages.css/sign-up.css" />
</head>
<body>
<div class="container">
    <h1>Signup</h1>

    <form id="signupForm">
      <div class="input-group">

        <input type="text" id="username" placeholder="Motun" required>
        <input type="email" id="email" placeholder="example@gmail.com" required>
        <input type="password" id="password" placeholder="Password" required>
        <input type="password" id="confirm-password" placeholder="Confirm Password" required>

      </div>

      <button type="submit">Signup</button>

      <p class="signup-link">
        Already have an account? <a href="./login.html">Log in</a>
      </p>

      <p id="error-msg"></p>
    </form>

  </div>

</body>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBb5SR7xj5ywVECkaRWEW4Bh0kHMj01WvQ",
    authDomain: "novawallet-6e0cb.firebaseapp.com",
    projectId: "novawallet-6e0cb",
    storageBucket: "novawallet-6e0cb.firebasestorage.app",
    messagingSenderId: "408070207218",
    appId: "1:408070207218:web:aee6c3a06582964ab4026b",
    measurementId: "G-1HPGP8X45H"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const signupForm = document.getElementById('signupForm');
  const errorMsg = document.getElementById('error-msg');

  signupForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    const username = document.getElementById('username').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();
    const confirmPassword = document.getElementById('confirm-password').value.trim();

    errorMsg.textContent = '';

    if (!username || !email || !password || !confirmPassword) {
      errorMsg.textContent = "All fields are required.";
      return;
    }

    if (username.length < 3) {
      errorMsg.textContent = "Username should be at least 3 characters long.";
      return;
    }
    if (username.length > 20) {
      errorMsg.textContent = "Username should not exceed 20 characters.";
      return;
    }

    if (!email.includes('@')) {
      errorMsg.textContent = "Please enter a valid email address.";
      return;
    }

    if (password.length < 6) {
      errorMsg.textContent = "Password should be at least 6 characters long.";
      return;
    }

    if (password !== confirmPassword) {
      errorMsg.textContent = "Passwords do not match!";
      return;
    }

    try {
      const credential = await createUserWithEmailAndPassword(auth, email, password);

      // 🔥 NEW FIX: Save username in Firebase Auth profile
      await updateProfile(credential.user, { displayName: username });

      // Also save username in localStorage for quick dashboard access
      localStorage.setItem('novaWalletUsername', username);

      alert("Account created successfully!");
      signupForm.reset();
      window.location.href = "./login.html";

    } catch (error) {
      console.log(error);
      errorMsg.textContent = error.message;
    }
  });
</script>
</html>
