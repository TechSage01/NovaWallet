<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta-name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - NovaWallet</title>
  <link rel="shortcut icon" href="../images/ChatGPT Image Nov 15, 2025, 09_59_30 PM.png" type="image/x-icon">
  <link rel="stylesheet" href="../otherpages.css/login.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>

  <div class="container">
    <h1 id="loginTitle">Login</h1>

    <form id="loginForm">
      <div class="input-group">
        <input type="email" id="email" placeholder="email@gmail.com" required>
        <input type="password" id="password" placeholder="Password" required>
      </div>

      <button type="submit">Log In</button>

      <p class="signup-link">
        Don't have an account? <a href="./sign-up.html">Sign up</a>
      </p>

      <p id="error-msg"></p>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBb5SR7xj5ywVECkaRWEW4Bh0kHMj01WvQ",
        authDomain: "novawallet-6e0cb.firebaseapp.com",
        projectId: "novawallet-6e0cb",
        storageBucket: "novawallet-6e0cb.firebasestorage.app",
        messagingSenderId: "408070207218",
        appId: "1:408070207218:web:aee6c3a06582964ab4026b",
        measurementId: "G-1HPGP8X45H"    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    
      const errorMsg = document.getElementById('error-msg');

    loginForm.addEventListener('submit', async(e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

       errorMsg.textContent = '';


    if (!email || !password) {
      errorMsg.textContent = "All fields are required.";
      return;
    }

    if (!email.includes('@')) {
      errorMsg.textContent = "Please enter a valid email address.";
      return;
    }

    if (password.length < 6) {
      errorMsg.textContent = "Password should be at least 6 characters long.";
      return;
    }

    

      try {
        const credential = await signInWithEmailAndPassword(auth, email, password);
        const user = credential.user;
        console.log('user logged in ', user);
        
        alert("Login successfully!");
        loginForm.reset();
        window.location.href = "./dashboard.html";
      } catch (error) {
        console.log(error);
        errorMsg.textContent = error.message;
        // alert("Error creating account: " + error.message);
    }
    });
  </script>


</body>
</html>
