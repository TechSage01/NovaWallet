<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome to Our User Dashboard</title>
  <link rel="shortcut icon" href="../images/ChatGPT Image Nov 15, 2025, 09_59_30 PM.png" type="image/x-icon" />
  <link rel="stylesheet" href="../otherpages.css/dashboard.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <style>
    /* PROFILE OVERLAY */
    .overlay {
      display: none;
      position: fixed;
      top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .confirm-box {
      background: #fff;
      padding: 20px 30px;
      border-radius: 10px;
      text-align: center;
      max-width: 350px;
      width: 90%;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .confirm-buttons {
      margin-top: 20px;
      display: flex;
      justify-content: space-around;
    }
    .confirm-btn, .cancel-btn {
      padding: 8px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: 600;
    }
    .confirm-btn {
      background: #2ecc71;
      color: #fff;
    }
    .cancel-btn {
      background: #e74c3c;
      color: #fff;
    }
    /* Make profile picture cursor pointer */
    #profilePicture {
      cursor: pointer;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <nav>
    <div class="nav-container">
      <div class="logo">
        <h2>NovaWallet</h2>
        <img src="../images/edited_NovaWallet-removebg-preview.png" alt="">
      </div>
      <div class="user-mini">
        <label class="profile-container">
          <img id="profilePicture" src="../images/avatar.jpg" alt="Profile">
        </label>
        <input type="file" id="profileInput" accept="image/*" style="display: none;">
        <span id="welcomeMessage"></span>
      </div>
      <button class="logout-btn" id="logoutBtn">
        <i class="fas fa-sign-out-alt"></i> Logout
      </button>
    </div>
  </nav>

  <!-- PROFILE CONFIRM OVERLAY -->
  <div id="profileConfirmOverlay" class="overlay">
    <div class="confirm-box">
      <h3>Change Profile Picture?</h3>
      <p>Are you sure you want to update your profile picture?</p>
      <div class="confirm-buttons">
        <button id="cancelChange" class="cancel-btn">Cancel</button>
        <button id="confirmChange" class="confirm-btn">Yes, Continue</button>
      </div>
    </div>
  </div>

  <!-- DASHBOARD CONTENT -->
  <div class="dashboard">
    <div class="dashboard-header">
      <h1>Expense Tracker Dashboard</h1>
      <p>Manage your income and expenses</p>
    </div>

    <!-- BALANCE DISPLAY -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-wallet"></i></div>
        <div class="stat-content">
          <h3 id="balanceTitle">Current Balance</h3>
          <div class="stat-value" id="balance">$0.00</div>
        </div>
      </div>
    </div>

    <!-- INCOME SECTION -->
    <div class="quick-actions">
      <h2>Add Income</h2>
      <div class="income-form">
        <input type="number" id="incomeAmount" placeholder="Enter income amount" min="0" step="0.01"/>
        <button id="addIncomeBtn" class="action-btn"><i class="fas fa-plus"></i> Add Income</button>
      </div>
    </div>

    <!-- EXPENSE SECTION -->
    <div class="transactions-section">
      <div class="section-header"><h2>Add Expense</h2></div>
      <div class="expense-form">
        <input type="text" id="expenseDescription" placeholder="Expense description"/>
        <input type="number" id="expenseAmount" placeholder="Amount" min="0" step="0.01"/>
        <button id="addExpenseBtn" class="action-btn"><i class="fas fa-plus"></i> Add Expense</button>
      </div>
    </div>

    <!-- EXPENSE LIST -->
    <div class="transactions-section">
      <div class="section-header"><h2>Expense List</h2></div>
      <div class="transactions-list" id="expenseList"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBb5SR7xj5ywVECkaRWEW4Bh0kHMj01WvQ",
      authDomain: "novawallet-6e0cb.firebaseapp.com",
      projectId: "novawallet-6e0cb",
      storageBucket: "novawallet-6e0cb.firebasestorage.app",
      messagingSenderId: "408070207218",
      appId: "1:408070207218:web:aee6c3a06582964ab4026b",
      measurementId: "G-1HPGP8X45H"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    let currentUser = null;
    let storedUsername = null;
    let balance = 0;
    let totalIncome = 0;
    let expenses = [];

    const welcomeMessage = document.getElementById("welcomeMessage");
    const logoutBtn = document.getElementById("logoutBtn");
    const balanceElement = document.getElementById("balance");
    const addIncomeBtn = document.getElementById("addIncomeBtn");
    const incomeAmount = document.getElementById("incomeAmount");
    const addExpenseBtn = document.getElementById("addExpenseBtn");
    const expenseDescription = document.getElementById("expenseDescription");
    const expenseAmount = document.getElementById("expenseAmount");
    const expenseList = document.getElementById("expenseList");

    // PROFILE ELEMENTS
    const profileInput = document.getElementById("profileInput");
    const profilePicture = document.getElementById("profilePicture");
    const overlay = document.getElementById("profileConfirmOverlay");
    const cancelBtn = document.getElementById("cancelChange");
    const confirmBtn = document.getElementById("confirmChange");

    // Load saved profile image
    const savedImage = localStorage.getItem("nova_profile_image");
    if (savedImage) profilePicture.src = savedImage;

    // Profile confirmation logic
    profilePicture.addEventListener("click", () => overlay.style.display = "flex");
    cancelBtn.addEventListener("click", () => overlay.style.display = "none");
    confirmBtn.addEventListener("click", () => {
      overlay.style.display = "none";
      profileInput.click();
    });
    profileInput.addEventListener("change", function () {
      const file = this.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        profilePicture.src = e.target.result;
        localStorage.setItem("nova_profile_image", e.target.result);
      };
      reader.readAsDataURL(file);
    });

            // welcome message 
            
    onAuthStateChanged(auth, (user) => {
      if (!user) return window.location.href = "login.html";
      currentUser = user;
      storedUsername = localStorage.getItem("novaWalletUsername") || "User";
      welcomeMessage.textContent = `Welcome back, ${storedUsername}!`;
      loadUserData();
    });

    function loadUserData() {
      balance = parseFloat(localStorage.getItem(`${storedUsername}_balance`)) || 0;
      totalIncome = parseFloat(localStorage.getItem(`${storedUsername}_totalIncome`)) || 0;
      expenses = JSON.parse(localStorage.getItem(`${storedUsername}_expenses`)) || [];
      updateBalance();
      updateExpenseList();
    }

    function updateBalance() {
      balanceElement.textContent = `$${balance.toFixed(2)}`;
      localStorage.setItem(`${storedUsername}_balance`, balance.toString());
      localStorage.setItem(`${storedUsername}_totalIncome`, totalIncome.toString());
    }

    function updateExpenseList() {
      expenseList.innerHTML = "";
      expenses.forEach((expense, index) => {
        const expenseItem = document.createElement("div");
        expenseItem.className = "transaction-item";
        expenseItem.innerHTML = `
          <div class="transaction-icon"><i class="fas fa-shopping-cart"></i></div>
          <div class="transaction-details">
            <h4>${expense.description}</h4>
            <p>${new Date(expense.date).toLocaleDateString()}</p>
          </div>
          <div class="transaction-amount negative">$${expense.amount.toFixed(2)}</div>
          <button class="delete-btn" data-index="${index}"><i class="fas fa-trash"></i></button>
        `;
        expenseList.appendChild(expenseItem);
      });
      localStorage.setItem(`${storedUsername}_expenses`, JSON.stringify(expenses));
    }

    addIncomeBtn.addEventListener("click", () => {
      const amount = parseFloat(incomeAmount.value);
      if (amount > 0) {
        balance += amount;
        totalIncome += amount;
        updateBalance();
        incomeAmount.value = "";
        alert("Income added successfully!");
      } else alert("Please enter a valid income amount.");
    });

    addExpenseBtn.addEventListener("click", () => {
      const description = expenseDescription.value.trim();
      const amount = parseFloat(expenseAmount.value);
      if (description && amount > 0) {
        expenses.push({ description, amount, date: new Date().toISOString() });
        balance -= amount;
        updateBalance();
        updateExpenseList();
        expenseDescription.value = "";
        expenseAmount.value = "";
        alert("Expense added successfully!");
      } else alert("Please enter a valid description and amount.");
    });

    expenseList.addEventListener("click", (e) => {
      const btn = e.target.closest(".delete-btn");
      if (!btn) return;
      const index = btn.dataset.index;
      const expense = expenses[index];
      if (confirm(`Are you sure you want to delete "${expense.description}" for $${expense.amount.toFixed(2)}?`)) {
        balance += expense.amount;
        expenses.splice(index, 1);
        updateBalance();
        updateExpenseList();
        alert("Expense deleted successfully!");
      }
    });

    logoutBtn.addEventListener("click", () => {
      if (confirm(`${storedUsername}, are you sure you want to log out?`)) {
        localStorage.removeItem("novaWalletUsername");
        localStorage.removeItem("LoggedInUser");
        window.location.href = "login.html";
      }
    });

  </script>
</body>
</html>
