<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signup - NovaWallet</title>
  <link rel="shortcut icon" href="../images/ChatGPT Image Nov 15, 2025, 09_59_30 PM.png" type="image/x-icon">
  <link rel="stylesheet" href="../otherpages.css/sign-up.css" />
</head>
<body>
<div class="container">

    <h1>Signup</h1>

    <!-- 🔥 ERROR BOX ADDED HERE -->
    <div id="error-box" class="hidden">
      <p id="error-text"></p>
      <span id="close-error">Close</span>
    </div>

    <form id="signupForm">
      <div class="input-group">
        <input type="text" id="username" placeholder="Motun" required>
        <input type="email" id="email" placeholder="example@gmail.com" required>
        <input type="password" id="password" placeholder="Password" required>
        <input type="password" id="confirm-password" placeholder="Confirm Password" required>
      </div>

      <button type="submit" id="submit">Signup</button>

      <p class="signup-link">
        Already have an account? <a href="./login.html">Log in</a>
      </p>

      <!-- <p id="error-msg"></p> -->
    </form>

</div>
</body>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
import { 
  getAuth, 
  createUserWithEmailAndPassword, 
  updateProfile, 
  sendEmailVerification 
} from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBb5SR7xj5ywVECkaRWEW4Bh0kHMj01WvQ",
  authDomain: "novawallet-6e0cb.firebaseapp.com",
  projectId: "novawallet-6e0cb",
  storageBucket: "novawallet-6e0cb.firebasestorage.app",
  messagingSenderId: "408070207218",
  appId: "1:408070207218:web:aee6c3a06582964ab4026b",
  measurementId: "G-1HPGP8X45H"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const signupForm = document.getElementById('signupForm');
const errorBox = document.getElementById("error-box");
const errorText = document.getElementById("error-text");
const closeError = document.getElementById("close-error");

function showError(message) {
  errorText.textContent = message;
  errorBox.classList.remove("hidden");
}

closeError.addEventListener("click", () => {
  errorBox.classList.add("hidden");
});

signupForm.addEventListener('submit', async (e) => {
  e.preventDefault();

  const username = document.getElementById('username').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value.trim();
  const confirmPassword = document.getElementById('confirm-password').value.trim();

  if (!username || !email || !password || !confirmPassword) {
    showError("All fields are required.");
    return;
  }

  if (password !== confirmPassword) {
    showError("Passwords do not match!");
    return;
  }
  const submitBtn = document.getElementById('submit');
  submitBtn.style.cursor = "not-allowed"
  submitBtn.style.backgroundColor = "gray"
  submitBtn.textContent = "Signing In...";

  try {
    const credential = await createUserWithEmailAndPassword(auth, email, password);

    await updateProfile(credential.user, { displayName: username });

    // ✅ Send verification email automatically
    await sendEmailVerification(credential.user);

    localStorage.setItem('novaWalletUsername', username);

    alert(`Account created successfully! A verification email has been sent to ${email}. Please verify before logging in.`);
    signupForm.reset();
    window.location.href = "./login.html";

  } catch (error) {
    console.log(error);
    showError(error.message);
  }
});
</script>

</html>
